submission:
  title: "CoPassage"

  problem_statement: >
    Urban commuters in Indian cities waste significant time and money travelling
    alone in under-filled cars while public transport is overcrowded. There is no
    trusted, city-aware platform that connects verified drivers with nearby
    passengers in real time, leading to increased traffic, pollution, and
    daily commute costs for millions of working professionals and students.

  solution_summary: >
    CoPassage is a full-stack carpooling platform built on Next.js and Supabase
    that lets drivers offer seats on their existing routes and passengers either
    search for matching rides or broadcast a ride need to local drivers. Once a
    match is confirmed, the driver streams their live GPS location via Supabase
    Realtime so the passenger can watch the car approach on an interactive
    OpenStreetMap-powered map — no paid API keys required.

  key_features:
    - "Dual-role app: verified drivers offer rides; passengers search or broadcast a need"
    - "Live GPS tracking: driver streams location via Supabase Realtime Broadcast, passenger sees a moving car icon on Leaflet/OpenStreetMap"
    - "Free geocoding via Nominatim (OpenStreetMap) converts text addresses to coordinates for proximity-sorted passenger feeds"
    - "Three-portal architecture: End-User app, City Staff portal, Super Admin panel — each with independent auth and Role-Level Security"
    - "Emergency SOS button that captures GPS coordinates and instantly raises an alert visible to City Staff"

  tech_stack:
    languages: ["TypeScript"]
    frameworks: ["Next.js 16 (App Router)", "React 19", "Tailwind CSS 4", "react-leaflet"]
    ibm_technologies: ["IBM Bob (used as the AI-assisted development environment throughout the build)"]
    databases: ["Supabase (PostgreSQL with Row Level Security)", "Supabase Realtime (Broadcast channel for live location)"]
    other: ["Leaflet + OpenStreetMap (free map tiles, no API key)", "Nominatim (free geocoding API)", "Lucide React", "Sonner (toast notifications)"]

  what_we_are_most_proud_of: >
    The end-to-end live tracking flow: a driver accepts a passenger request on
    My Rides, receives a "Start Ride" button that navigates them to a full-screen
    map, their browser's navigator.geolocation feeds coordinates into a Supabase
    Realtime Broadcast channel, and the passenger's "Track Ride" view instantly
    shows a moving car icon without any paid mapping or WebSocket infrastructure.
    The entire real-time pipeline runs at zero marginal cost.

  known_limitations: >
    Driver verification is instant (MVP shortcut) — production would queue
    registrations for City Staff approval. Seat decrement on acceptance is not
    atomic (no Postgres function), so a race condition exists under concurrent
    requests. Payment processing is UI-only with no real payment gateway
    integration. City list is hardcoded to four Indian cities; a production
    version would use a dynamic city registry. The find-passengers feed does not
    yet support filtering or pagination. The presentation slide deck is a
    placeholder pending final recording. No automated test suite exists.

