submission:
  title: "CoPassage"

  problem_statement: >
    Urban commuters who rely on auto-rickshaws frequently travel alone and pay
    the full fare because there's no easy way to find nearby people heading in the
    same direction. Meanwhile, other commuters struggle to hail autos. This lack
    of commuter-to-commuter coordination leads to wasted money, increased traffic,
    and higher carbon emissions.

  solution_summary: >
    CoPassage is a peer-to-peer auto-rickshaw fare-splitting platform that connects
    commuters entirely offline from drivers. A rider who boards an auto broadcasts
    their route; nearby users see this on a live OpenStreetMap and can request to
    join. The app facilitates the match, mutual location sharing, and chat, allowing
    them to split the metered fare directly.

  key_features:
    - "Peer-to-peer offline hailing: the app focuses strictly on commuter coordination without any driver dispatch or tracking."
    - "Live location broadcasting: a host's location is streamed via Supabase Realtime to a Leaflet-powered map."
    - "Privacy-first matching: a joining rider's exact location is protected until a mutual match is confirmed by the host."
    - "Mutual ride completion: atomic Postgres triggers ensure rides are completed securely when both parties confirm."
    - "One-tap emergency SOS: writes exact GPS coordinates directly to the database before launching hotlines."

  tech_stack:
    languages: ["TypeScript", "SQL"]
    frameworks: ["Vite", "React 19", "Tailwind CSS 4", "React Router", "react-leaflet", "@vis.gl/react-google-maps"]
    ibm_technologies: ["IBM Bob (used as the AI-assisted development environment throughout the build)"]
    databases: ["Supabase (PostgreSQL with Row Level Security)", "Supabase Realtime (Broadcast channels)"]
    other: ["Firebase Auth", "Razorpay Payment Gateway", "Leaflet + OpenStreetMap (free map tiles)", "Google GenAI API"]

  what_we_are_most_proud_of: >
    The strict separation of concerns in our commuter-to-commuter model. By 
    removing the driver from the software loop, we built a highly scalable, zero-
    onboarding system. We are particularly proud of the complex Postgres trigger 
    logic that handles atomic mutual ride completion securely across two separate 
    RLS-protected tables without exposing write permissions to either party.

  known_limitations: >
    Location tracking accuracy depends heavily on the device's GPS hardware and 
    browser permissions, especially on iOS Safari where background tracking can be 
    limited. Route overlap heuristic uses straight-line bearing rather than actual 
    road networks to save API costs. There is no automated test suite.

